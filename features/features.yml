    title: Segment chunking
    description: Merge Whisper segments into ~220-word, ≤120 s retrieval windows with one-segment overlap.
    implemented: true
    status: shipped
    surface: cli
    link: ragio/chunk.py
    docs: DESIGN.md
    prd: [FR4]
    tags: [pipeline]
