    title: Episode catalog
    description: Parse the Radiolab RSS feed into SQLite with per-episode pipeline status, and download MP3s resumably.
    implemented: true
    status: shipped
    surface: cli
    link: ragio/catalog.py
    docs: README.md
    prd: [FR1, FR2, FR13, NFR2]
    tags: [pipeline]
  - id: RAGIO-002
    title: Local Whisper transcription
    description: Transcribe episodes locally with faster-whisper or mlx-whisper into timestamped segments with word timings, cached as JSON.
    implemented: true
    status: shipped
    surface: cli
    link: ragio/transcribe.py
    docs: DESIGN.md
    prd: [FR3, NFR1, NFR2]
    tags: [pipeline, whisper]
