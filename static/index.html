<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragio-Lab</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --ink:#e8e8ea; --muted:#9aa0ab; --accent:#f5c518; --line:#2a2f3a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 16px 80px; }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  p.sub { color:var(--muted); margin:0 0 24px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:15px; }
  button { padding:12px 18px; border-radius:10px; border:0; background:var(--accent); color:#111; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #answer { white-space:pre-wrap; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:20px; min-height:60px; }
  .src { border-top:1px solid var(--line); padding:14px 0; }
  .src b { color:var(--accent); }
  .src .meta { color:var(--muted); font-size:13px; }
  .src .ex { margin:6px 0; color:#c9cdd4; font-size:14px; }
  audio { width:100%; height:32px; margin-top:6px; }
  a { color:var(--accent); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  #answer.error { border-color:#e5534b; color:#f0a8a3; }
</style>
</head>
<body>
<main>
  <h1>Ragio<span>-</span>Lab</h1>
  <p class="sub">Ask anything across every Radiolab episode. Answers cite the exact moment; press play to hear it.</p>
  <form id="f">
    <label for="q" class="sr-only">Your question</label>
    <input id="q" name="q" required minlength="2" maxlength="2000" autocomplete="off" placeholder="e.g. Which episodes talk about the placebo effect, and how do they differ?" autofocus>
    <button id="go">Ask</button>
  </form>
  <div id="answer" hidden aria-live="polite" aria-busy="false"></div>
  <div id="sources"></div>
</main>
<script>
const f = document.getElementById('f'), q = document.getElementById('q'), go = document.getElementById('go');
const ans = document.getElementById('answer'), srcs = document.getElementById('sources');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (question.length < 2) { q.focus(); return; }
  go.disabled = true; ans.hidden = false; ans.textContent = ''; ans.classList.remove('error');
  ans.setAttribute('aria-busy', 'true'); srcs.innerHTML = '';
  try {
    const res = await fetch('/api/ask/stream', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question})});
    if (!res.ok || !res.body) {
      let detail = '';
      try { const body = await res.json(); detail = typeof body.detail === 'string' ? body.detail : ''; } catch (_) {}
      throw new Error(`The server answered ${res.status}${detail ? ': ' + detail : ''}. Is Qdrant/Ollama running? (see /readyz)`);
    }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i; while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'token') ans.textContent += ev.text;
        if (ev.type === 'sources') renderSources(ev.sources);
        if (ev.type === 'error') throw new Error(ev.message || 'The answer stopped with an error.');
      }
    }
  } catch (err) {
    ans.classList.add('error');
    ans.textContent += (ans.textContent ? '\n\n' : '') + (err && err.message ? err.message : 'Request failed.');
  } finally {
    ans.setAttribute('aria-busy', 'false');
    go.disabled = false;
  }
});
function renderSources(list) {
  srcs.innerHTML = list.map(s => `
    <div class="src">
      <b>[${esc(s.label)}]</b> ${esc(s.title)} <span class="meta">· ${esc(s.published)} · ${esc(s.start_hms)}–${esc(s.end_hms)}
        ${safeUrl(s.page_url) ? `· <a href="${esc(safeUrl(s.page_url))}" target="_blank" rel="noopener noreferrer">episode page</a>` : ''}</span>
      <div class="ex">${esc(s.excerpt)}</div>
      <audio controls preload="none" src="${esc(s.clip_url)}" aria-label="Play clip ${esc(s.label)}: ${esc(s.title)} at ${esc(s.start_hms)}"></audio>
    </div>`).join('');
}
function esc(t) { return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Feed-supplied links: only http(s), never javascript:/data:.
function safeUrl(u) { try { const url = new URL(u, location.href); return /^https?:$/.test(url.protocol) ? url.href : ''; } catch (_) { return ''; } }
</script>
</body>
</html>
